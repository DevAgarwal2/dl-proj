[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmed"
version = "0.1.0"
description = "OpenMed - medical vision model + retrieval-augmented explanation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenMed" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
vision = ["torch>=2.2", "torchvision>=0.17", "timm>=0.9", "medmnist>=3.0"]
rag = ["sentence-transformers>=2.6"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.30"]
dev = ["pytest>=8.0"]

[project.scripts]
openmed = "openmed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
